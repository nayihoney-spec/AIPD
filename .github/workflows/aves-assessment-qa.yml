name: Aves Assessment source and evidence QA
on:
  pull_request:
    paths:
      - "products/aves-assessment/**"
      - ".github/workflows/aves-assessment-qa.yml"
  workflow_dispatch:
    inputs:
      external_beta:
        description: "Run fail-closed External Beta evidence gate (NO-GO until evidence and approval)"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static source check (no secrets or API writes)
        run: node products/aves-assessment/scripts/qa-gate.mjs
  external_beta_evidence:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.external_beta }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fail-closed External Beta evidence check (no promotion)
        run: node products/aves-assessment/scripts/qa-gate.mjs --external
