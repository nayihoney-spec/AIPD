<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accept Aves Invitation</title><style>
body{font-family:system-ui;background:#f5f7fb;margin:0;display:grid;place-items:center;min-height:100vh;color:#172033}.card{width:min(460px,92vw);background:white;border:1px solid #dfe4ec;border-radius:18px;padding:24px;box-shadow:0 14px 36px #23305a1a}label{display:block;font-size:12px;font-weight:700;margin:14px 0 6px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #dfe4ec;border-radius:10px;font-size:16px}button{width:100%;margin-top:16px;padding:11px;border:0;border-radius:10px;background:#3446d3;color:#fff;font-weight:700}.err{color:#b42318;font-size:12px;margin-top:10px}</style></head><body>
<form class="card" id="f"><h1>Accept invitation</h1><p>Create your Aves Assessment access password.</p><label>Name</label><input id="n" required><label>Password</label><input id="p" type="password" minlength="12" required><label>Interface language</label><select id="l"><option value="en">English</option><option value="zh-Hant">繁體中文</option><option value="zh-Hans">简体中文</option><option value="fr">Français</option><option value="ja">日本語</option><option value="es">Español</option><option value="vi">Tiếng Việt</option><option value="th">ไทย</option></select><button>Activate access</button><div class="err" id="err"></div></form>
<script>document.getElementById("f").onsubmit=async(e=>{e.preventDefault();err.textContent="";const token=new URLSearchParams(location.search).get("token")||"";const r=await fetch("/api/v1/auth/accept-invitation",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({token,displayName:n.value,password:p.value,locale:l.value})});const x=await r.json();if(!r.ok){err.textContent=x.error||"Activation failed";return}location.href="/"});</script></body></html>
