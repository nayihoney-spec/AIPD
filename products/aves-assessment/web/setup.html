<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aves Assessment Setup</title><style>
body{font-family:system-ui;background:#f5f7fb;margin:0;display:grid;place-items:center;min-height:100vh;color:#172033}.card{width:min(480px,92vw);background:white;border:1px solid #dfe4ec;border-radius:18px;padding:24px;box-shadow:0 14px 36px #23305a1a}h1{margin:0 0 8px}p{color:#667085;line-height:1.5}label{display:block;font-size:12px;font-weight:700;margin:14px 0 6px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #dfe4ec;border-radius:10px;font-size:16px}button{width:100%;margin-top:16px;padding:11px;border:0;border-radius:10px;background:#3446d3;color:white;font-weight:700}.note{background:#eef1ff;padding:10px;border-radius:10px;font-size:12px;margin:12px 0}.err{color:#b42318;font-size:12px;margin-top:10px}</style></head><body>
<form class="card" id="f"><h1>Initialize Aves Assessment</h1><p>Create the first Platform Admin. This page closes automatically after the first Admin is created.</p><div class="note">Use this only on the protected internal preview before opening the public stable URL.</div><label>Admin name</label><input id="n" value="Platform Admin" required><label>Admin email</label><input id="e" type="email" required><label>Password</label><input id="p" type="password" minlength="12" required><label>Interface language</label><select id="l"><option value="en">English</option><option value="zh-Hant">繁體中文</option><option value="zh-Hans">简体中文</option></select><button>Create Platform Admin</button><div class="err" id="err"></div></form>
<script>document.getElementById("f").onsubmit=async(ev=>{ev.preventDefault();err.textContent="";const r=await fetch("/api/v1/setup/bootstrap-admin",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({displayName:n.value,email:e.value,password:p.value,locale:l.value})});const x=await r.json();if(!r.ok){err.textContent=x.error||"Setup failed";return}location.href="/login"});</script></body></html>
