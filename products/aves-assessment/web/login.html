<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aves Assessment Login</title><style>
body{font-family:system-ui;background:#f5f7fb;margin:0;display:grid;place-items:center;min-height:100vh;color:#172033}.card{width:min(420px,92vw);background:white;border:1px solid #dfe4ec;border-radius:18px;padding:24px;box-shadow:0 14px 36px #23305a1a}h1{margin:0 0 8px;font-size:24px}p{color:#667085}label{display:block;font-size:12px;font-weight:700;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #dfe4ec;border-radius:10px;font-size:16px}button{width:100%;margin-top:16px;padding:11px;border:0;border-radius:10px;background:#3446d3;color:#fff;font-weight:700}.err{color:#b42318;font-size:12px;margin-top:10px}</style></head><body>
<form class="card" id="f"><h1>Aves Assessment</h1><p>Authorized access only.</p><label>Email</label><input id="e" type="email" required autocomplete="username"><label>Password</label><input id="p" type="password" required autocomplete="current-password"><button>Sign in</button><div class="err" id="err"></div></form>
<script>document.getElementById("f").onsubmit=async(e=>{e.preventDefault();err.textContent="";const r=await fetch("/api/v1/auth/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:document.getElementById("e").value,password:document.getElementById("p").value})});const x=await r.json();if(!r.ok){err.textContent=x.error||"Login failed";return}location.href="/"});</script></body></html>
