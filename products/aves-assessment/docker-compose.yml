services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db-postgres:
        condition: service_healthy
        required: false
      db-mysql:
        condition: service_healthy
        required: false

  db-postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aves_assessment}
      POSTGRES_USER: ${POSTGRES_USER:-aves}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - aves_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-aves} -d ${POSTGRES_DB:-aves_assessment}"]
      interval: 5s
      timeout: 3s
      retries: 30

  db-mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aves_assessment}
      MYSQL_USER: ${MYSQL_USER:-aves}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - aves_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  aves_pgdata:
  aves_mysqldata:
